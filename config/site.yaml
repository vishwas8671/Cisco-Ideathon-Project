site_name: "Meridian Trust Bank - Retail Branch"

vlans:
  - id: 10
    name: "Employee"
    subnet: "10.10.10.0/24"
    gateway: "10.10.10.1"
    dhcp_range:
      start: "10.10.10.10"
      end: "10.10.10.250"
  - id: 20
    name: "Guest"
    subnet: "10.10.20.0/24"
    gateway: "10.10.20.1"
    dhcp_range:
      start: "10.10.20.10"
      end: "10.10.20.250"
  - id: 30
    name: "Server"
    subnet: "10.10.30.0/24"
    gateway: "10.10.30.1"
    dhcp_range: null  # Server VLAN uses static IP assignments
  - id: 99
    name: "Management"
    subnet: "10.10.99.0/24"
    gateway: "10.10.99.1"
    dhcp_range:
      start: "10.10.99.10"
      end: "10.10.99.50"

security_rules:
  - id: "RULE-01"
    name: "Guest Isolation"
    description: "Prevent all traffic from Guest VLAN 20 from accessing the Server VLAN 30"
    source: "10.10.20.0/24"
    destination: "10.10.30.0/24"
    action: "deny"
    protocol: "ip"
  - id: "RULE-02"
    name: "Secure Management Access"
    description: "Restrict SSH access to network devices to only the Management VLAN 99"
    source: "10.10.99.0/24"
    destination: "any"
    action: "permit"
    protocol: "tcp"
    destination_port: 22

devices:
  routers:
    - name: "R1"
      model: "Cisco 2911"
      interfaces:
        - name: "GigabitEthernet0/0"
          description: "WAN Uplink to ISP"
          ip_address: "192.168.1.100/24"  # Public/External DHCP or Static IP simulated
          nat_mode: "outside"
        - name: "GigabitEthernet0/1"
          description: "Trunk link to SW1"
          subinterfaces:
            - id: 10
              vlan: 10
              ip_address: "10.10.10.1/24"
              nat_mode: "inside"
            - id: 20
              vlan: 20
              ip_address: "10.10.20.1/24"
              nat_mode: "inside"
              acl_applied: "GUEST_IN"
            - id: 30
              vlan: 30
              ip_address: "10.10.30.1/24"
              nat_mode: "inside"
            - id: 99
              vlan: 99
              ip_address: "10.10.99.1/24"
              nat_mode: "inside"
  switches:
    - name: "SW1"
      model: "Cisco 2960"
      management_ip: "10.10.99.2/24"
      trunk_interfaces:
        - name: "GigabitEthernet0/1"
          connected_to: "R1:GigabitEthernet0/1"
          allowed_vlans: [10, 20, 30, 99]
        - name: "GigabitEthernet0/2"
          connected_to: "SW2:GigabitEthernet0/2"
          allowed_vlans: [10, 20, 30, 99]
      access_interfaces:
        - name: "FastEthernet0/1"
          vlan: 10
          connected_to: "PC-Teller1"
        - name: "FastEthernet0/2"
          vlan: 10
          connected_to: "PC-Teller2"
        - name: "FastEthernet0/10"
          vlan: 30
          connected_to: "SRV1"
        - name: "FastEthernet0/11"
          vlan: 99
          connected_to: "PC-Admin"
    - name: "SW2"
      model: "Cisco 2960"
      management_ip: "10.10.99.3/24"
      trunk_interfaces:
        - name: "GigabitEthernet0/2"
          connected_to: "SW1:GigabitEthernet0/2"
          allowed_vlans: [10, 20, 30, 99]
      access_interfaces:
        - name: "FastEthernet0/1"
          vlan: 10
          connected_to: "PC-Emp1"
        - name: "FastEthernet0/2"
          vlan: 10
          connected_to: "PC-Emp2"
        - name: "FastEthernet0/3"
          vlan: 10
          connected_to: "PC-Manager"
        - name: "FastEthernet0/20"
          vlan: 20
          connected_to: "WAP1"
